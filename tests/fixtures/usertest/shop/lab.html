<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Driver lab</title></head>
<body>
  <!-- Driver behaviors the shop does not exercise. Not linked from the shop. -->
  <h1>Driver lab</h1>
  <button id="del">Delete everything</button>
  <p id="out" role="status"></p>
  <a href="/lab.html#opened" target="_blank">Open help in a new tab</a>
  <button id="close" hidden>Close this tab</button>
  <a href="https://example.com/">Visit our partner</a>
  <button id="script-tab">Open by script</button>
  <button id="script-partner">Open partner by script</button>
  <label for="when">Visit date</label> <input type="date" id="when">
  <button id="times">Show times</button> <p id="slots"></p>
  <x-greeting></x-greeting>
  <iframe title="Payment form" srcdoc="<button>Pay</button>" width="200" height="60"></iframe>
  <div id="wide" style="min-width: 34rem; display: flex; justify-content: flex-end"><button id="far">Far button</button></div>
  <script>
    document.getElementById('del').addEventListener('click', () => {
      document.getElementById('out').textContent = confirm('Delete everything? This cannot be undone.') ? 'Deleted' : 'Kept';
    });
    if (location.hash === '#opened') {
      const close = document.getElementById('close');
      close.hidden = false;
      close.addEventListener('click', () => window.close());
    }
    document.getElementById('script-tab').addEventListener('click', () => window.open('/lab.html#opened'));
    document.getElementById('script-partner').addEventListener('click', () => window.open('https://example.org/'));
    document.getElementById('far').addEventListener('click', () => (document.getElementById('out').textContent = 'Far reached'));
    document.getElementById('times').addEventListener('click', async () => {
      const out = document.getElementById('slots');
      out.textContent = 'Nothing available';
      const { times } = await (await fetch('/api/slow')).json();
      out.textContent = `Open: ${times.join(', ')}`;
    });
    customElements.define('x-greeting', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = '<button>Say hello</button><span></span>';
        root.querySelector('button').addEventListener('click', () => (root.querySelector('span').textContent = 'Hello from the shadow'));
      }
    });
  </script>
</body>
</html>
